name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Unzip newest potrikaghor_flutter zip
        run: |
          set -e
          best=""
          bestt=0
          for f in potrikaghor_flutter*.zip; do
            [ -f "$f" ] || continue
            t=$(git log -1 --format=%ct -- "$f")
            if [ "$t" -gt "$bestt" ]; then bestt=$t; best="$f"; fi
          done
          echo "Using: $best"
          [ -n "$best" ] || { echo "No potrikaghor_flutter zip found"; exit 1; }
          unzip -q -o "$best"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android files and build
        working-directory: potrikaghor
        run: |
          bash setup.sh
          flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: potrikaghor-apk
          path: potrikaghor/build/app/outputs/flutter-apk/app-release.apk
