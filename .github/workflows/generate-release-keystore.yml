name: Generate Release Keystore (One-Time)

on:
  workflow_dispatch:

jobs:
  generate-keystore:
    runs-on: ubuntu-latest

    steps:
      - name: Generate PKCS12 Keystore, Verify, and Encode to Base64
        run: |
          set -euo pipefail

          KEYSTORE_PASSWORD=$(openssl rand -base64 24 | tr -dc 'A-Za-z0-9' | head -c 24)

          echo "================================================================"
          echo "COPY THIS PASSWORD FOR GITHUB SECRETS (KEYSTORE_PASSWORD & KEY_PASSWORD):"
          echo "$KEYSTORE_PASSWORD"
          echo "KEY_ALIAS:"
          echo "potrikaghor-release"
          echo "================================================================"

          keytool -genkeypair \
            -v \
            -storetype PKCS12 \
            -keystore release-keystore.p12 \
            -alias potrikaghor-release \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEYSTORE_PASSWORD" \
            -dname "CN=PotrikaGhor, OU=Mobile, O=PotrikaGhor, L=Dhaka, S=Dhaka, C=BD"

          VERIFY_OUTPUT=$(keytool -list -v \
            -keystore release-keystore.p12 \
            -storetype PKCS12 \
            -storepass "$KEYSTORE_PASSWORD")

          echo "$VERIFY_OUTPUT"

          echo "$VERIFY_OUTPUT" | grep -q "Alias name: potrikaghor-release"
          echo "$VERIFY_OUTPUT" | grep -q "Entry type: PrivateKeyEntry"

          base64 -w 0 release-keystore.p12 > keystore-base64.txt

      - name: Upload Keystore and Base64 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: potrikaghor-release-keystore
          path: |
            release-keystore.p12
            keystore-base64.txt
          retention-days: 1
